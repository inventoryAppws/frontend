<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-label="Return and refund journey from customer doorstep to inspection center">
  <defs>
    <linearGradient id="skyReturn" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e0f2fe"/>
      <stop offset=".65" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="roadReturn" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8ba1b8"/>
      <stop offset=".18" stop-color="#cbd8e6"/>
      <stop offset=".2" stop-color="#6f849b"/>
      <stop offset="1" stop-color="#55697d"/>
    </linearGradient>
    <linearGradient id="vanReturn" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="qcBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coinGradRet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowReturn" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#152e4d" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="190" fill="url(#skyReturn)"/>

  <!-- Fluffy Cloud Layer -->
  <g fill="#ffffff" opacity=".82">
    <path d="M130 28c8-16 30-13 34 0 17-8 30 3 31 14H108c1-10 10-16 22-14z"/>
    <path d="M520 16c7-14 27-12 32 0 16-7 29 4 29 13h-82c1-9 10-15 21-13z"/>
    <path d="M890 32c7-15 28-13 34 0 16-8 30 4 30 14h-86c2-10 10-16 22-14z"/>
  </g>

  <!-- Distant Tech Skyline -->
  <g opacity=".4" fill="#93c5fd">
    <path d="M238 123V70h27v53zm35 0V49h38v74zm48 0V79h22v44zm32 0V58h43v65zm53 0V89h25v34zm35 0V43h36v80zm46 0V65h28v58zm39 0V80h44v43zm55 0V53h30v70zm40 0V73h51v50zm63 0V46h42v77zm52 0V84h29v39zm39 0V60h47v63zm57 0V76h26v47z"/>
    <g fill="#bfdbfe">
      <path d="M238 76h27v4h-27zm35-21h38v5h-38zm80 9h43v5h-43zm88-15h36v5h-36zm105 10h30v5h-30zm103-7h42v5h-42zm91 13h47v5h-47z"/>
    </g>
  </g>

  <!-- Green Grass Verges -->
  <path d="M0 129h1200v18H0z" fill="#bbf7d0"/>
  <path d="M0 142h1200v8H0z" fill="#86efac"/>

  <!-- Main Scene Interactive Elements with Drop Shadows -->
  <g filter="url(#shadowReturn)">
    
    <!-- LEFT: Inspection & Return Warehouse -->
    <g transform="translate(68 72)">
      <path d="M2 59V18h128v41z" fill="#ffffff" stroke="#cbd5e1"/>
      <path d="M-8 18h146L126 6H6z" fill="#2563eb"/>
      <path d="M-4 14h138l-6-6H4z" fill="#1d4ed8"/>
      <!-- Window & Door Bays -->
      <rect x="18" y="27" width="28" height="30" rx="2" fill="#dbeafe"/>
      <rect x="82" y="27" width="28" height="30" rx="2" fill="#dbeafe"/>
      <rect x="52" y="24" width="22" height="35" fill="#1e3a8a"/>
      <!-- Warehouse Banner -->
      <rect x="24" y="29" width="78" height="9" rx="1.5" fill="#ffffff"/>
      <text x="28" y="36.5" font-family="Arial,sans-serif" font-size="6.5" font-weight="800" fill="#1d4ed8">RETURN &amp; QC HUB</text>
      <!-- Green QC Pass Badge -->
      <circle cx="120" cy="12" r="11" fill="url(#qcBadgeGrad)"/>
      <path d="M115 12l3.5 3.5 6.5-7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="3" font-family="Arial,sans-serif" font-size="5.5" font-weight="700" fill="#047857">QC PASS</text>
    </g>

    <!-- Return Packages Staging Bay -->
    <g transform="translate(212 122)">
      <rect x="0" y="-12" width="24" height="16" rx="2" fill="#d97706"/>
      <rect x="28" y="-20" width="28" height="24" rx="2" fill="#f59e0b"/>
      <rect x="60" y="-10" width="20" height="14" rx="2" fill="#d97706"/>
      <path d="M12 -12v16M42 -20v24M70 -10v14" stroke="#ffffff" opacity=".7" stroke-width="2"/>
      <!-- Small Return Loop Icon on Box -->
      <circle cx="42" cy="-8" r="6" fill="#2563eb"/>
      <path d="M40 -9a2.5 2.5 0 1 1 0 2.5l-1.2 -1.2" fill="none" stroke="#fff" stroke-width="1.2"/>
    </g>

    <!-- MIDDLE: Return Pickup Van (Facing left towards warehouse) -->
    <g transform="translate(460 104)">
      <!-- Van Body Facing Left -->
      <path d="M148 22H52V0H22L0 22v20h148z" fill="url(#vanReturn)"/>
      <path d="M48 5H26L13 22h35z" fill="#bfdbfe"/>
      <!-- Van Branding -->
      <rect x="68" y="7" width="70" height="17" rx="2" fill="#1e40af"/>
      <text x="73" y="19" font-family="Arial,sans-serif" font-size="8" font-weight="800" fill="#ffffff">REVERSE PICKUP</text>
      <!-- Roof Beacon -->
      <path d="M96 0V-7h15v7" fill="#60a5fa"/>
      <!-- Reverse Rotation Decal -->
      <circle cx="126" cy="30" r="7.5" fill="#3b82f6"/>
      <path d="M124 28.5a3.5 3.5 0 1 1 0 3.5l-1.5 -1.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <!-- Wheels -->
      <circle cx="32" cy="43" r="11" fill="#1e293b"/>
      <circle cx="32" cy="43" r="5" fill="#e2e8f0"/>
      <circle cx="120" cy="43" r="11" fill="#1e293b"/>
      <circle cx="120" cy="43" r="5" fill="#e2e8f0"/>
    </g>

    <!-- Right-Center: Glowing Refund ₹ Coins Flying to Wallet -->
    <g transform="translate(730 84)">
      <circle cx="16" cy="22" r="13" fill="url(#coinGradRet)" stroke="#d97706" stroke-width="1.5"/>
      <text x="11.5" y="27" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#78350f">₹</text>
      <circle cx="48" cy="10" r="10" fill="url(#coinGradRet)" stroke="#d97706" stroke-width="1.2"/>
      <text x="44.5" y="14" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#78350f">₹</text>
      <path d="M-5 32q25 -18 58 0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 3"/>
    </g>

    <!-- Courier Pickup Agent with Handheld Scanner -->
    <g transform="translate(860 102)">
      <circle cx="16" cy="42" r="10" fill="#1e293b"/>
      <circle cx="64" cy="42" r="10" fill="#1e293b"/>
      <circle cx="16" cy="42" r="4" fill="#dce7ee"/>
      <circle cx="64" cy="42" r="4" fill="#dce7ee"/>
      <path d="M16 38L32 20h24l12 18z" fill="#2563eb"/>
      <path d="M30 19l14 1 12 18H36z" fill="#3b82f6"/>
      <circle cx="42" cy="8" r="9" fill="#1e293b"/>
      <path d="M36 14h14l7 15H30z" fill="#f59e0b"/>
      <path d="M0 35h16m42 0h22" stroke="#1e293b" stroke-width="3"/>
    </g>

    <!-- RIGHT: Customer Residence with Doorstep Return Box -->
    <g transform="translate(1020 74)">
      <path d="M6 59V26l58-32 60 32v33z" fill="#ffffff" stroke="#cbd5e1"/>
      <path d="M-4 26L64-7l68 33-9 6H5z" fill="#0284c7"/>
      <path d="M0 23L64-10l64 33-8 4H7z" fill="#0ea5e9"/>
      <rect x="54" y="34" width="20" height="25" fill="#93c5fd"/>
      <rect x="20" y="31" width="20" height="15" fill="#bae6fd"/>
      <rect x="88" y="31" width="20" height="15" fill="#bae6fd"/>
      <!-- Doorstep Box Ready for Pickup -->
      <rect x="-18" y="44" width="18" height="15" rx="1.5" fill="#f59e0b"/>
      <path d="M-9 44v15" stroke="#ffffff" stroke-width="1.8"/>
      <!-- Pickup Pin -->
      <circle cx="-9" cy="38" r="4.5" fill="#2563eb"/>
      <circle cx="-9" cy="38" r="2" fill="#ffffff"/>
    </g>

  </g>

  <!-- Roadside Trees -->
  <g fill="#10b981" filter="url(#shadowReturn)">
    <g transform="translate(24 102)"><rect x="13" y="31" width="6" height="20" fill="#78350f"/><circle cx="16" cy="17" r="17"/><circle cx="4" cy="26" r="11"/><circle cx="27" cy="28" r="12"/></g>
    <g transform="translate(360 110)"><rect x="13" y="29" width="6" height="14" fill="#78350f"/><circle cx="16" cy="17" r="15"/><circle cx="4" cy="26" r="10"/><circle cx="27" cy="28" r="10"/></g>
    <g transform="translate(775 106)"><rect x="13" y="29" width="6" height="17" fill="#78350f"/><circle cx="16" cy="17" r="16"/><circle cx="4" cy="27" r="11"/><circle cx="28" cy="28" r="11"/></g>
    <g transform="translate(1150 104)"><rect x="13" y="29" width="6" height="18" fill="#78350f"/><circle cx="16" cy="17" r="16"/><circle cx="4" cy="27" r="11"/><circle cx="28" cy="28" r="11"/></g>
  </g>

  <!-- Asphalt Road with Return Lane Markings -->
  <path d="M0 150h1200v40H0z" fill="url(#roadReturn)"/>
  <path d="M0 169h1200" stroke="#ffffff" stroke-width="3" stroke-dasharray="32 24" opacity=".95"/>
</svg>
