<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant Ocean Radial Lighting -->
    <radialGradient id="oceanGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>

    <!-- Clip to Full Size Sphere -->
    <clipPath id="globeClip">
      <circle cx="32" cy="32" r="31"/>
    </clipPath>
  </defs>

  <!-- Full Size Ocean Sphere (Edge-to-Edge, No Black Background) -->
  <circle cx="32" cy="32" r="31" fill="url(#oceanGrad)"/>

  <!-- Continents & Atmosphere (Scaled to Full 62px Diameter) -->
  <g clip-path="url(#globeClip)">
    <g transform="translate(32, 32) scale(1.41) translate(-32, -32)">
      <!-- North America & Greenland -->
      <path d="M16 20 C18 16 23 15 26 18 C28 20 27 25 24 28 C22 30 18 29 16 26 C15 24 14 22 16 20 Z" fill="#16A34A"/>
      <path d="M28 15 C30 13 34 14 33 17 C31 18 28 17 28 15 Z" fill="#16A34A"/>

      <!-- South America -->
      <path d="M22 32 C26 31 29 35 28 40 C27 45 23 48 21 47 C20 44 20 36 22 32 Z" fill="#16A34A"/>

      <!-- Europe & Africa -->
      <path d="M34 16 C37 15 41 18 39 21 C37 23 34 21 34 16 Z" fill="#22C55E"/>
      <path d="M35 23 C41 23 44 27 42 34 C40 41 36 43 33 38 C31 33 31 27 35 23 Z" fill="#22C55E"/>

      <!-- Asia & Pacific Islands -->
      <path d="M42 16 C47 16 52 20 50 26 C47 29 44 26 42 22 Z" fill="#22C55E"/>
      <path d="M48 30 C50 30 52 32 50 34 C48 34 47 32 48 30 Z" fill="#22C55E"/>

      <!-- White Atmosphere Cloud Swirls -->
      <path d="M13 24 Q24 20 35 27 T55 25" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.45"/>
      <path d="M17 39 Q27 35 38 42 T51 39" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    </g>

    <!-- 3D Specular Highlight Rim -->
    <path d="M3 32 C3 16 16 3 32 3 C20 5 8 16 8 32 C8 44 15 53 25 59 C12 55 3 44.5 3 32 Z" fill="#FFFFFF" fill-opacity="0.32"/>
  </g>
</svg>