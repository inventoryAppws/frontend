<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="custBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.75)"/>
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="260" rx="16" fill="url(#custBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="80" cy="50" r="90" fill="#38bdf8" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="520" cy="200" r="110" fill="#0284c7" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Left Floating Product Card (Headphones / Audio) -->
  <g transform="translate(60, 35)" filter="url(#cardShadow)">
    <rect width="180" height="190" rx="16" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    
    <!-- Mini Product Image Pod -->
    <rect x="18" y="16" width="144" height="92" rx="12" fill="#f0f9ff"/>
    <!-- Headphone Icon Vector -->
    <path d="M 70 65 A 22 22 0 0 1 110 65 V 78 A 6 6 0 0 1 104 84 H 100 A 4 4 0 0 1 96 80 V 66 A 4 4 0 0 1 100 62 H 106 M 80 84 H 76 A 6 6 0 0 1 70 78 V 65 A 4 4 0 0 1 74 62 H 80 A 4 4 0 0 1 84 66 V 80 A 4 4 0 0 1 80 84 Z" fill="#0284c7"/>

    <!-- Rating Pill -->
    <g transform="translate(18, 118)">
      <rect width="52" height="20" rx="6" fill="#fef3c7"/>
      <path d="M 28 128 L 30 123 L 34 123 L 31 120 L 32 116 L 28 119 L 24 116 L 25 120 L 22 123 L 26 123 Z" fill="url(#goldGrad)"/>
      <text x="36" y="132" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">4.9</text>
    </g>

    <!-- Product Title & Price -->
    <text x="18" y="154" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Acoustic Pro</text>
    <text x="18" y="172" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0284c7">₹4,299</text>
    <text x="75" y="172" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-decoration="line-through">₹6,999</text>
  </g>

  <!-- Center Floating Main Phone Mockup / Checkout Flow -->
  <g transform="translate(265, 20)" filter="url(#cardShadow)">
    <rect width="170" height="220" rx="20" fill="#ffffff" stroke="rgba(255,255,255,0.95)" stroke-width="2"/>
    <!-- Phone Notch -->
    <rect x="55" y="8" width="60" height="12" rx="6" fill="#0f172a"/>
    
    <!-- App Header inside Mockup -->
    <text x="20" y="42" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Cart &amp; Checkout</text>
    <rect x="135" y="32" width="16" height="16" rx="4" fill="#e0f2fe"/>
    <circle cx="143" cy="40" r="3" fill="#0284c7"/>

    <!-- Cart Item 1 -->
    <rect x="16" y="55" width="138" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="22" y="61" width="26" height="26" rx="6" fill="#e0f2fe"/>
    <text x="54" y="73" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">Nike Air Zoom</text>
    <text x="54" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="800" fill="#0284c7">₹8,499</text>

    <!-- Cart Item 2 -->
    <rect x="16" y="100" width="138" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="22" y="106" width="26" height="26" rx="6" fill="#fef3c7"/>
    <text x="54" y="118" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">Acoustic Pro</text>
    <text x="54" y="131" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="800" fill="#0284c7">₹4,299</text>

    <!-- Instant Checkout Button -->
    <rect x="16" y="152" width="138" height="32" rx="10" fill="url(#blueAccent)"/>
    <text x="85" y="172" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Place Order →</text>

    <!-- Trust Badge -->
    <text x="85" y="200" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="middle">✓ Instant Wallet Refund Protected</text>
  </g>

  <!-- Right Floating Darwin AI Assistant Chip -->
  <g transform="translate(450, 48)" filter="url(#cardShadow)">
    <rect width="115" height="110" rx="14" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
    <circle cx="58" cy="38" r="20" fill="#e0f2fe"/>
    <!-- Robot/Sparkle Icon -->
    <path d="M 58 28 L 60 35 L 67 38 L 60 41 L 58 48 L 56 41 L 49 38 L 56 35 Z" fill="#0284c7"/>
    <text x="58" y="72" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#0369a1" text-anchor="middle">Darwin AI</text>
    <rect x="22" y="80" width="71" height="18" rx="9" fill="#0284c7"/>
    <text x="58" y="93" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Best Price Found</text>
  </g>
</svg>

